<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Price Tracker</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>
          </svg>
          Flight Price Tracker
        </div>
        <nav class="nav-tabs">
          <button class="nav-tab active" data-tab="search">Search</button>
          <button class="nav-tab" data-tab="history">History</button>
          <button class="nav-tab" data-tab="alerts">Price Alerts</button>
        </nav>
      </div>
    </header>

    <!-- Search Tab -->
    <div id="tab-search" class="tab-content active">
      <section class="search-panel card">
        <h2>Search Flights</h2>
        <form id="search-form">
          <div class="form-grid">
            <div class="form-group">
              <label>From</label>
              <input type="text" id="from_airport" placeholder="e.g. KUL" maxlength="4" required>
            </div>
            <div class="form-group swap-group">
              <button type="button" id="swap-btn" title="Swap airports">⇄</button>
            </div>
            <div class="form-group">
              <label>To</label>
              <input type="text" id="to_airport" placeholder="e.g. CGK" maxlength="4" required>
            </div>
            <div class="form-group">
              <label>From Date</label>
              <input type="date" id="date_from" required>
            </div>
            <div class="form-group">
              <label>To Date</label>
              <input type="date" id="date_to" required>
            </div>
            <div class="form-group">
              <label>Cabin Class</label>
              <select id="seat_class">
                <option value="economy">Economy</option>
                <option value="premium-economy">Premium Economy</option>
                <option value="business">Business</option>
                <option value="first">First</option>
              </select>
            </div>
            <div class="form-group">
              <label>Currency</label>
              <select id="currency">
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="JPY">JPY</option>
                <option value="SGD">SGD</option>
                <option value="MYR">MYR</option>
                <option value="IDR">IDR</option>
              </select>
            </div>
          </div>
          <button type="submit" id="search-btn" class="btn btn-primary">
            <span class="btn-text">Search Flights</span>
            <span class="spinner hidden"></span>
          </button>
        </form>
      </section>

      <!-- Progress -->
      <section id="progress-section" class="card hidden">
        <div class="progress-header">
          <span id="progress-label">Scraping flights…</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
        <p id="progress-detail" class="progress-detail"></p>
      </section>

      <!-- Results Dashboard -->
      <div id="results-section" class="hidden">
        <!-- Stats Row -->
        <div class="stats-row" id="stats-row"></div>

        <!-- Chart + Calendar Row -->
        <div class="charts-row">
          <section class="card chart-card">
            <h3>Price Trend</h3>
            <div class="chart-wrapper">
              <canvas id="trend-chart"></canvas>
            </div>
          </section>
          <section class="card calendar-card">
            <h3>Price Calendar</h3>
            <div id="price-calendar"></div>
          </section>
        </div>

        <!-- Flight Table -->
        <section class="card table-card">
          <div class="table-header">
            <h3>All Flights</h3>
            <div class="table-controls">
              <input type="text" id="table-filter" placeholder="Filter by airline…" class="filter-input">
              <select id="stops-filter">
                <option value="">All stops</option>
                <option value="0">Direct only</option>
                <option value="1">Max 1 stop</option>
              </select>
            </div>
          </div>
          <div class="table-wrapper">
            <table id="flights-table">
              <thead>
                <tr>
                  <th data-col="flight_date" class="sortable">Date <span class="sort-icon">↕</span></th>
                  <th data-col="airlines" class="sortable">Airline <span class="sort-icon">↕</span></th>
                  <th data-col="departure_time" class="sortable">Departure <span class="sort-icon">↕</span></th>
                  <th data-col="arrival_time" class="sortable">Arrival <span class="sort-icon">↕</span></th>
                  <th data-col="duration_minutes" class="sortable">Duration <span class="sort-icon">↕</span></th>
                  <th data-col="stops" class="sortable">Stops <span class="sort-icon">↕</span></th>
                  <th data-col="price" class="sortable">Price <span class="sort-icon">↕</span></th>
                </tr>
              </thead>
              <tbody id="flights-tbody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>

    <!-- History Tab -->
    <div id="tab-history" class="tab-content hidden">
      <section class="card">
        <h2>Search History</h2>
        <div id="history-list" class="history-list"></div>
      </section>
    </div>

    <!-- Alerts Tab -->
    <div id="tab-alerts" class="tab-content hidden">
      <section class="card">
        <h2>Price Alerts</h2>
        <form id="alert-form" class="alert-form">
          <div class="form-grid">
            <div class="form-group">
              <label>From</label>
              <input type="text" id="alert_from" placeholder="e.g. KUL" maxlength="4" required>
            </div>
            <div class="form-group">
              <label>To</label>
              <input type="text" id="alert_to" placeholder="e.g. CGK" maxlength="4" required>
            </div>
            <div class="form-group">
              <label>Price Threshold ($)</label>
              <input type="number" id="alert_threshold" placeholder="e.g. 150" min="1" required>
            </div>
            <div class="form-group">
              <label>Label (optional)</label>
              <input type="text" id="alert_label" placeholder="e.g. Weekend trip">
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Add Alert</button>
        </form>
        <div id="alerts-list" class="alerts-list"></div>
      </section>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
